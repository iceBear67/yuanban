minestom-data = { module = "net.minestom:data", version.ref = "minestom-data" }
minestom-testing = { module = "net.minestom:testing", version.ref = "minestom" }

[plugins]
download = { id = "de.undercouch.download", version.ref = "download" }
freefair-lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
