[versions]
annotations = "26.1.0"
adventure = "5.2.0"
brigadier = "1.3.10"
caffeine = "3.3.0"
datafixerupper = "10.0.21"
fastutil = "8.5.19"
gson = "2.14.0"
guava = "33.6.0-jre"
junit = "6.0.0"
kotest = "6.2.5"
