dependencies {
    // 玩家由 bot 扮演
    api(project(":bot:runtime"))
    api(libs.minestom)
    // @Story 组合了 JUnit 的 @Test 与 @ExtendWith，StoryExtension 实现 JUnit 的扩展接口
    api(platform(libs.junit.bom))
    api(libs.junit.jupiter.api)
    // 期望中的比较使用 Kotest 的 Matcher
    api(libs.kotest.assertions.core)
    api(libs.kotlin.stdlib)
    // 按照 KClass 取得 ServerSetup 的 object 实例或者调用无参构造方法
    implementation(libs.kotlin.reflect)
    // 运行示例故事，检查扩展给出的测试结论
    testImplementation(libs.junit.platform.testkit)
}

tasks.withType(Test).configureEach {
    // 示例故事只由 EngineTestKit 显式选择运行，两个测试任务都排除它们
    useJUnitPlatform {
        excludeTags("sample")
    }
    // JoinStories 中 Transfer 到测试服务端：服务端属性在共享 JVM 中只读，只能在启动 JVM 时设置
    systemProperty("minestom.accept-transfers", "true")
}

// 调试服务端（io.ib67.yuanban.story.debug，storyServer 任务）的源码在 src/debug/kotlin，需要访问 main 中
// internal 的类（StoryMonitor、PausePoint、StoryClock 等），以及 main 的全部依赖。
// test 额外关联 debug：DebugMonitor 等类的单元测试直接写在 test 源码集里，需要访问 debug 中 internal 的类
sourceSets {
    debug {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.debug.output
        runtimeClasspath += sourceSets.debug.output
    }
}

configurations {
    debugImplementation.extendsFrom(api, implementation)
    testImplementation.extendsFrom(debugImplementation)
}

dependencies {
    // 发现并运行故事，只有调试服务端需要
    debugImplementation(libs.junit.platform.launcher)
}

kotlin {
    // 让 debug 的 Kotlin 编译关联 main：既提供 main 的 internal 可见性，也补上编译期的 Kotlin 元数据依赖
    target.compilations.getByName("debug").associateWith(target.compilations.getByName("main"))
    // test 关联 debug，原因同上
    target.compilations.getByName("test").associateWith(target.compilations.getByName("debug"))
}

tasks.register("storyServer", JavaExec) {
    description = "启动调试服务端，在游戏中运行 story 故事"
    group = "verification"
    // debug 源码集的运行时类路径加上 test 的运行时类路径：调试服务端需要发现测试中的故事
    classpath = sourceSets.debug.runtimeClasspath + sourceSets.test.runtimeClasspath
    mainClass = "io.ib67.yuanban.story.debug.StoryServer"
    standardInput = System.in
    systemProperty("minestom.properties.mutable", "true")
    dependsOn(":extractVanillaServer")
    systemProperty("yuanban.vanilla-server", rootProject.ext.vanillaServerJar)
}
