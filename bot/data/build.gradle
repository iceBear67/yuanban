plugins {
    // 原版注册表数据与区块构造由其它模块的测试复用
    id("java-test-fixtures")
}

dependencies {
    api(libs.mcprotocollib) {
        // 这些 jar 中的类位于 it.unimi.dsi.fastutil 包，与下面的 fastutil 同名
        exclude group: "com.nukkitx.fastutil"
    }
    // EntityTypeData.passengerAttachments 返回 Minestom 的 Vec
    api(libs.minestom)
    // MCProtocolLib 的公开类型使用 fastutil（HolderSet.getHolders()、点击窗口数据包的变化槽位）
    api(libs.fastutil)
    // Minestom 以 implementation 依赖它，不在本模块的编译类路径上
    implementation(libs.minestom.data)
}
